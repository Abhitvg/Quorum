# Secrets template — DO NOT commit real values to git.
# Use `kubectl create secret` or external-secrets-operator in production.
#
# Create secrets manually:
#   kubectl create secret generic quorum-secrets \
#     --namespace quorum \
#     --from-literal=JWT_SECRET=<your-jwt-secret> \
#     --from-literal=LIVEKIT_API_KEY=<your-key> \
#     --from-literal=LIVEKIT_API_SECRET=<your-secret> \
#     --from-literal=S3_ACCESS_KEY_ID=<your-key> \
#     --from-literal=S3_SECRET_ACCESS_KEY=<your-secret> \
#     --from-literal=INTERNAL_API_KEY=<your-key> \
#     --from-literal=GOOGLE_CLIENT_ID=<your-id> \
#     --from-literal=GOOGLE_CLIENT_SECRET=<your-secret> \
#     --from-literal=S3_BUCKET=<your-bucket>
#
#   kubectl create secret generic datadog-secret \
#     --namespace datadog \
#     --from-literal=api-key=<your-dd-api-key>
#
apiVersion: v1
kind: Secret
metadata:
  name: quorum-secrets
  namespace: quorum
  labels:
    app.kubernetes.io/part-of: quorum
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  LIVEKIT_API_KEY: "REPLACE_ME"
  LIVEKIT_API_SECRET: "REPLACE_ME"
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  S3_BUCKET: "REPLACE_ME"
  INTERNAL_API_KEY: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
