apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quorum-ingress
  namespace: quorum
  labels:
    app.kubernetes.io/part-of: quorum
  annotations:
    # AWS ALB Ingress Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: quorum
    # Certificate — uses ACM discovery by domain
    alb.ingress.kubernetes.io/certificate-arn: ""  # Overridden per environment
    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Sticky sessions for WebSocket (LiveKit)
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
spec:
  ingressClassName: alb
  rules:
    # Web frontend — default host
    - host: quorum.atma-ai.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quorum-web
                port:
                  number: 3000
    # API backend — api subdomain
    - host: api.quorum.atma-ai.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quorum-api
                port:
                  number: 3001
