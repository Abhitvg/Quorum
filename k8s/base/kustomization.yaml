apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quorum

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  # API
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  # Web
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  # Agent
  - agent/deployment.yaml
  - agent/hpa.yaml
  # Ingress
  - ingress/ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: quorum
