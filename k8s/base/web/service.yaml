apiVersion: v1
kind: Service
metadata:
  name: quorum-web
  namespace: quorum
  labels:
    app.kubernetes.io/name: quorum-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: quorum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quorum-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
