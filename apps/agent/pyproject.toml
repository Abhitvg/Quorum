[project]
name = "quorum-agent"
version = "0.1.0"
description = "LiveKit agent for Quorum AI participant"
authors = [
    {name = "Quorum"}
]
dependencies = [
    "livekit~=0.17",
    "livekit-agents~=0.11",
    "livekit-plugins-deepgram~=0.6",
    "livekit-plugins-elevenlabs",
    "python-dotenv~=1.0",
    "aiohttp~=3.9",
    "pytest~=8.0",
    "pytest-asyncio~=0.23",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
