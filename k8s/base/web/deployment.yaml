apiVersion: apps/v1
kind: Deployment
metadata:
  name: quorum-web
  namespace: quorum
  labels:
    app.kubernetes.io/name: quorum-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: quorum
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "quorum-web"
    tags.datadoghq.com/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quorum-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quorum-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: quorum
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "quorum-web"
        tags.datadoghq.com/version: "0.1.0"
      annotations:
        ad.datadoghq.com/quorum-web.logs: '[{"source":"nodejs","service":"quorum-web"}]'
    spec:
      containers:
        - name: quorum-web
          image: quorum-web:latest  # Overridden per environment (ECR URI)
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.quorum.atma-ai.co.in"
            - name: NEXT_PUBLIC_LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  name: quorum-config
                  key: NEXT_PUBLIC_LIVEKIT_URL
            - name: DD_SERVICE
              value: "quorum-web"
            - name: DD_VERSION
              value: "0.1.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_OPTIONS
              value: "--require dd-trace/init"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      terminationGracePeriodSeconds: 30
