apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quorum-api
  namespace: quorum
  labels:
    app.kubernetes.io/name: quorum-api
    app.kubernetes.io/part-of: quorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quorum-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
