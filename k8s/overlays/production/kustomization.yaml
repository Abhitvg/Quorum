apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: quorum-production

resources:
  - ../../base

patches:
  # Production replica counts
  - target:
      kind: Deployment
      name: quorum-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: quorum-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: quorum-agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Production HPA
  - target:
      kind: HorizontalPodAutoscaler
      name: quorum-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: HorizontalPodAutoscaler
      name: quorum-web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8
  - target:
      kind: HorizontalPodAutoscaler
      name: quorum-agent
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  # Production hostnames
  - target:
      kind: Ingress
      name: quorum-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: quorum.atma-ai.co.in
      - op: replace
        path: /spec/rules/1/host
        value: api.quorum.atma-ai.co.in
  # Production image tags (overridden by CI/CD with SHA)
  - target:
      kind: Deployment
      name: quorum-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: 238158254662.dkr.ecr.eu-north-1.amazonaws.com/quorum-api:latest
  - target:
      kind: Deployment
      name: quorum-web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: 238158254662.dkr.ecr.eu-north-1.amazonaws.com/quorum-web:latest
  - target:
      kind: Deployment
      name: quorum-agent
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: 238158254662.dkr.ecr.eu-north-1.amazonaws.com/quorum-agent:latest
  # Production resource limits — higher for API and Agent
  - target:
      kind: Deployment
      name: quorum-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  - target:
      kind: Deployment
      name: quorum-agent
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
  # Production ConfigMap overrides
  - target:
      kind: ConfigMap
      name: quorum-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: quorum-config
      data:
        DD_ENV: "production"
        DD_TRACE_SAMPLE_RATE: "0.5"
        DD_PROFILING_ENABLED: "true"
        NEXT_PUBLIC_API_URL: "https://api.quorum.atma-ai.co.in"
