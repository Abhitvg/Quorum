apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quorum-agent
  namespace: quorum
  labels:
    app.kubernetes.io/name: quorum-agent
    app.kubernetes.io/part-of: quorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quorum-agent
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Longer window — agent sessions shouldn't be interrupted
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
