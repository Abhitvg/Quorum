version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - cd ../..
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - pnpm install
        build:
          commands:
            - pnpm run build --filter=web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
