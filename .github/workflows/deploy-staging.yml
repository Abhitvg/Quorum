name: Deploy to Staging

on:
  push:
    branches:
      - staging
      - develop
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER_NAME: QuorumCluster
  ECR_REGISTRY: 238158254662.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Build & Push Docker images to ECR with staging tag
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images (Staging)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/quorum-api:${{ steps.meta.outputs.tag }} \
            -t ${{ env.ECR_REGISTRY }}/quorum-api:staging \
            .
          docker push ${{ env.ECR_REGISTRY }}/quorum-api:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/quorum-api:staging

      - name: Build & Push Web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api-staging.quorum.atma-ai.co.in \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL=wss://quorum-oor689rg.livekit.cloud \
            -t ${{ env.ECR_REGISTRY }}/quorum-web:${{ steps.meta.outputs.tag }} \
            -t ${{ env.ECR_REGISTRY }}/quorum-web:staging \
            .
          docker push ${{ env.ECR_REGISTRY }}/quorum-web:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/quorum-web:staging

      - name: Build & Push Agent image
        run: |
          docker build -f apps/agent/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/quorum-agent:${{ steps.meta.outputs.tag }} \
            -t ${{ env.ECR_REGISTRY }}/quorum-agent:staging \
            .
          docker push ${{ env.ECR_REGISTRY }}/quorum-agent:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/quorum-agent:staging

  # -----------------------------------------------------------------------
  # Job 2: Deploy to EKS Staging
  # -----------------------------------------------------------------------
  deploy-staging:
    name: Deploy to EKS (Staging)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Update image tags in staging overlay
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            quorum-api=${{ env.ECR_REGISTRY }}/quorum-api:${{ needs.build-and-push.outputs.image-tag }} \
            quorum-web=${{ env.ECR_REGISTRY }}/quorum-web:${{ needs.build-and-push.outputs.image-tag }} \
            quorum-agent=${{ env.ECR_REGISTRY }}/quorum-agent:${{ needs.build-and-push.outputs.image-tag }}

      - name: Apply Kustomize manifests
        run: |
          kubectl apply -k k8s/overlays/staging/

      - name: Apply Datadog manifests
        run: |
          kubectl apply -k k8s/base/datadog/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/quorum-api -n quorum --timeout=300s
          kubectl rollout status deployment/quorum-web -n quorum --timeout=300s
          kubectl rollout status deployment/quorum-agent -n quorum --timeout=300s

      - name: Verify staging deployment
        run: |
          echo "=== Staging Pod Status ==="
          kubectl get pods -n quorum
          echo ""
          echo "=== Staging Services ==="
          kubectl get svc -n quorum
          echo ""
          echo "=== Staging Ingress ==="
          kubectl get ingress -n quorum
